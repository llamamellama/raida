# Copy to raida.toml and edit. Every value except llm.model has a default.
# Environment overrides: RAIDA_<SECTION>__<KEY>, e.g. RAIDA_LLM__MODEL="gpt-oss:120b".

log_level = "INFO"

[llm]
backend = "llama_server"             # "llama_server" (recommended) | "ollama" | "openai_compatible" | "fake"
base_url = "http://127.0.0.1:8080"   # llama-server (make llm); Ollama: http://127.0.0.1:11434; LM Studio: http://127.0.0.1:1234
model = "gpt-oss:120b"               # REQUIRED. For llama-server, the --alias it was started with (make llm uses the Ollama tag)
interactive_budget_tokens = 32000    # normal answers: long sources through their notes, short ones in full
passage_budget_tokens = 2000         # verbatim passages found for each question, on top of the notes; 0 = off
synthesis_budget_tokens = 64000      # "Read full text" answers; above this the sources are condensed first
output_reserve_tokens = 8192
keep_alive = "1h"                    # Ollama only; llama-server unloads after RAIDA_LLAMA_IDLE_S
request_timeout_s = 3600             # the server is silent while it reads a long prompt; cover the slowest prefill
temperature = 0.3
suggest_titles = true                # name each session after its first answer
# think = false                      # answer without reasoning first: faster, less structured. Ollama: only hybrid models (Qwen3 2504, Qwen3.5/3.6), leave unset for thinking-only tags; "low" | "medium" | "high" for gpt-oss

[notes]
enabled = true                       # take notes on each long source as soon as it is ready
min_source_tokens = 3000             # shorter sources are always read in full
section_tokens = 4000                # excerpt behind each set of notes (about 25 minutes of speech)
ratio = 0.18                         # notes length relative to the excerpt

[transcribe]
backend = "parakeet"                 # "parakeet" | "whisper" | "apple" | "fake"
parakeet_model = "mlx-community/parakeet-tdt-0.6b-v3"
whisper_model = "mlx-community/whisper-large-v3-mlx"
language_detection = true
allow_model_download = false         # set true once, online, to fetch weights; then back to false
# ffmpeg_path = "/opt/homebrew/bin/ffmpeg"   # when the first ffmpeg on PATH is not the one you want

[ocr]
enabled = true
languages = ["en-US"]
dpi = 300

[pdf]
extractor = "pymupdf4llm"            # or "pypdfium2" for a permissive-license-only stack

[paths]
# data_dir = "~/Library/Application Support/raida"
# allowed_roots = ["~/Movies", "~/Downloads"]   # for "add by path" without uploading

[server]
host = "127.0.0.1"
port = 8765
open_browser = true

[workers]
cpu = "auto"                         # performance cores, capped at 6
gpu = 1                              # concurrent transcriptions; keep at 1 unless measured
llm = 1                              # concurrent answers
llm_background = 1                   # concurrent background calls (notes, reading sessions ahead); they pause during answers

[export]
pdf_renderer = "auto"                # "weasyprint" | "fpdf2" | "auto"
