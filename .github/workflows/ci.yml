name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Install system libraries for WeasyPrint and ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 ffmpeg
      - run: uv sync --all-groups --extra bundled-ffmpeg
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
